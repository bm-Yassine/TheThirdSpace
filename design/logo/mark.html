<!doctype html><html><head><meta charset="utf-8"><style>
 body{margin:0;background:transparent}
 svg{display:block}
</style></head><body>

<!-- Reusable mark: three circles meeting; the shared centre is the third space. -->
<svg id="app-icon" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2136"/><stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <clipPath id="k1"><circle cx="512" cy="410" r="188"/></clipPath>
    <clipPath id="k2"><circle cx="398" cy="608" r="188"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="27">
    <circle cx="512" cy="410" r="188"/>
    <circle cx="398" cy="608" r="188"/>
    <circle cx="626" cy="608" r="188"/>
  </g>
  <g clip-path="url(#k1)"><g clip-path="url(#k2)">
    <circle cx="626" cy="608" r="188" fill="url(#core)"/>
  </g></g>
</svg>

<!-- Android adaptive foreground: mark only, inside the 66% safe zone. -->
<svg id="android-fg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="core2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <clipPath id="m1"><circle cx="512" cy="454" r="118"/></clipPath>
    <clipPath id="m2"><circle cx="440" cy="578" r="118"/></clipPath>
  </defs>
  <g fill="none" stroke="#ffffff" stroke-width="17">
    <circle cx="512" cy="454" r="118"/>
    <circle cx="440" cy="578" r="118"/>
    <circle cx="584" cy="578" r="118"/>
  </g>
  <g clip-path="url(#m1)"><g clip-path="url(#m2)">
    <circle cx="584" cy="578" r="118" fill="url(#core2)"/>
  </g></g>
</svg>

<!-- Android adaptive background -->
<svg id="android-bg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1b2136"/><stop offset="100%" stop-color="#0b0f1a"/>
  </linearGradient></defs>
  <rect width="1024" height="1024" fill="url(#bg2)"/>
</svg>

<!-- Monochrome (themed icons): flat silhouette -->
<svg id="android-mono" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#ffffff" stroke-width="17">
    <circle cx="512" cy="454" r="118"/>
    <circle cx="440" cy="578" r="118"/>
    <circle cx="584" cy="578" r="118"/>
  </g>
</svg>

<!-- Splash: mark without the plate, drawn on the splash background colour -->
<svg id="splash" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="core3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <clipPath id="s1"><circle cx="512" cy="424" r="176"/></clipPath>
    <clipPath id="s2"><circle cx="405" cy="608" r="176"/></clipPath>
  </defs>
  <g fill="none" stroke="#111827" stroke-width="25">
    <circle cx="512" cy="424" r="176"/>
    <circle cx="405" cy="608" r="176"/>
    <circle cx="619" cy="608" r="176"/>
  </g>
  <g clip-path="url(#s1)"><g clip-path="url(#s2)">
    <circle cx="619" cy="608" r="176" fill="url(#core3)"/>
  </g></g>
</svg>

</body></html>
